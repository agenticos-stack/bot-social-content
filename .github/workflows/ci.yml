name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      # pnpm 12's executable is generated by its install lifecycle. Suppressing
      # scripts leaves the npm global shim as a shell error on hosted Node 24
      # runners (`syntax error near unexpected token ')'`). Dependencies below
      # still install with scripts disabled; only the package-manager bootstrap
      # needs its lifecycle enabled.
      - run: npm install --global pnpm@12.2.1 --no-audit --no-fund
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate
